# CI is the merge gate (ADR-0002). The `gate` job is the one required check.
# A pull request whose changed files are all documents takes the light path: `changes` decides, the test job is skipped
# and `docs` runs the structure checks instead. Anything else, and every push to main, takes the full path.
# Tests run once, with coverage, and the structure checks read that coverage in the same job. The structure checks
# also run the Go backend's gofmt, go vet and go test (ADR-0019): the setup action installs Go for every job.
name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Is every changed file a document? Documents are *.md under docs/ (not docs/generated/) and *.md in the repository
  # root. Everything else is an input of some check. The diff is against the branch the pull request merges into; if it
  # cannot be taken, or is empty, or this is not a pull request, the answer is false (full path).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Are all changed files documents?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          docs_only=false
          reason="not a pull request"
          if [ "$EVENT" = "pull_request" ]; then
            if files=$(git -c core.quotepath=off diff --name-only --no-renames "origin/$BASE_REF...HEAD") && [ -n "$files" ]; then
              others=""
              while IFS= read -r f; do
                case "$f" in
                  docs/generated/*) others="$others$f"$'\n' ;;
                  docs/*.md) ;;
                  */*) others="$others$f"$'\n' ;;
                  *.md) ;;
                  *) others="$others$f"$'\n' ;;
                esac
              done <<< "$files"
              if [ -z "$others" ]; then
                docs_only=true
                reason="every changed file is a document"
              else
                reason="files that are not documents:"
              fi
            else
              reason="the diff against the base could not be taken or is empty"
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          {
            echo "### Path: $([ "$docs_only" = true ] && echo light || echo full)"
            echo "$reason"
            # An `if`, not `[ -n ... ] && ...`: with nothing to list (every push to main) the test would end the
            # step with status 1 and fail the job.
            if [ -n "${others:-}" ]; then
              printf '%s' "$others" | head -20 | sed 's/^/- /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  lint-types:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck

  # Tests once, with coverage; then every structure check, which reads that coverage. The tests of the PostgreSQL
  # adapter and of the server on it run against a real PostgreSQL 16, the service container below. The variable gives
  # them its address; without it those tests fail (they are never skipped, ADR-0032). The container is throwaway
  # and listens on the job's own network only, so it needs no password.
  test:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: praxium
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U praxium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PRAXIUM_TEST_PG_DSN: postgres://praxium@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm test
      - if: github.event_name == 'pull_request'
        run: pnpm tsx harness/src/run-all.ts --with-coverage --base origin/${{ github.base_ref }}
      - if: github.event_name != 'pull_request'
        run: pnpm tsx harness/src/run-all.ts --with-coverage
      # The web UI (ADR-0035): the typed API layer must be what the contract generates, and the web build and the
      # program with the build inside must succeed. The tests and structure checks above ran without the web build.
      - name: Web API layer matches the contract
        run: pnpm web:gen-api --check
      - name: Build the web UI and the program with it
        run: scripts/build-with-web.sh "$RUNNER_TEMP/praxium"
      # The quality table's coverage column is read from a record made here, from the coverage this job just measured
      # (docs/generated/coverage-record.json, not committed). Without it every coverage cell says "unknown".
      - name: Record the measured coverage
        run: pnpm tsx harness/src/checks/quality.ts record > /dev/null
      - name: Quality grades of this change
        if: always()
        run: pnpm tsx harness/src/checks/quality.ts print >> "$GITHUB_STEP_SUMMARY"

  # backend/go.sum is the only proof of what the one third-party module contains, and it was first written without
  # the checksum database (ADR-0032). This job asks the official database for the same lines: scripts/verify-go-sum.sh
  # rebuilds go.sum in an empty module cache against the default proxy and database and fails when it differs.
  # The same job compiles the program for every release target (ADR-0039), so a change that only breaks Windows or
  # macOS fails here and not at the first tag. It takes about two minutes on a cold cache and no other job waits for it.
  go-sum:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - run: scripts/verify-go-sum.sh
      - name: Every release target compiles
        run: scripts/release-build.sh --compile-only

  # The light path: structure checks without coverage.
  docs:
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm tsx harness/src/run-all.ts --base origin/${{ github.base_ref }}

  gate:
    needs: [changes, lint-types, test, go-sum, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job on the path this change took must have passed
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.lint-types.result }}
          TEST: ${{ needs.test.result }}
          GO_SUM: ${{ needs.go-sum.result }}
          DOCS: ${{ needs.docs.result }}
        run: |
          fail=0
          check() { if [ "$2" != "success" ]; then echo "::error::$1 is $2"; fail=1; else echo "$1: ok"; fi; }
          check changes "$CHANGES"
          if [ "$DOCS_ONLY" = "true" ]; then
            echo "light path (documents only)"
            check docs "$DOCS"
          else
            echo "full path"
            check lint-types "$LINT"
            check test "$TEST"
            check go-sum "$GO_SUM"
          fi
          exit $fail
