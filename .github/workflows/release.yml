# Release build (ADR-0039, ADR-0047). A tag `v*` (v0.1.0, v0.1.0-alpha.1) builds the program for five targets with the
# web UI inside, packs one archive per target with SHA256SUMS, and makes the GitHub release. A manual run
# (workflow_dispatch) with a `version` does the same and makes the tag too, at the `commit` (a commit of main); with no
# version it builds a snapshot and makes no release: the files stay a workflow artifact, so the whole path can be
# tried first. The work is in scripts/release-plan.sh, scripts/release-build.sh, scripts/release-smoke.sh and
# scripts/release-publish.sh; this file only calls them. A tag with a `-` in it is marked as a pre-release. Only the
# GITHUB_TOKEN is used, and it may write only in the `release` job. Inputs and github.* values go in through `env:`,
# never into a script body.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0-alpha.1 or v0.1.0-alpha.1 (empty: build a snapshot, no release)"
        required: false
        default: ""
        type: string
      commit:
        description: "Full 40-digit SHA of the commit to release; it must be on main (empty: the tip of the chosen branch)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  # Checks the inputs and decides the tag, the commit and whether to publish. It runs the scripts of the ref that was run.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      # All history and tags: the plan asks whether the commit is on main and whether the tag exists.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        name: Plan the release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RUN_SHA: ${{ github.sha }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_COMMIT: ${{ inputs.commit }}
        run: scripts/release-plan.sh

  # Builds the commit the plan chose, with that commit's own scripts and setup action, so one commit gives one set of bytes.
  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The one third-party module must be what the checksum database vouches for before anything is built from it.
      - run: scripts/verify-go-sum.sh
      # A release is named after its tag; a snapshot takes the script's default (0.0.0-snapshot.<sha>).
      - name: Build, pack and checksum
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: scripts/release-build.sh --version "$TAG" --out "$RUNNER_TEMP/release"
      - name: Try the Linux amd64 archive as a person who downloaded it would
        run: scripts/release-smoke.sh "$RUNNER_TEMP"/release/praxium_*_linux_amd64.tar.gz
      - name: List the files
        run: |
          {
            echo "### Release files"
            echo '```'
            cat "$RUNNER_TEMP/release/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 14

  # The one job that may write to the repository. It runs the scripts and the release notes of the ref that was run,
  # not those of the commit that was built, and only when the plan says to publish.
  release:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: ${{ runner.temp }}/release
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
          MODE: ${{ needs.plan.outputs.mode }}
        run: scripts/release-publish.sh "$RUNNER_TEMP/release"
