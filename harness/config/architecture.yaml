# Architecture contract. Enforced by harness/src/checks/architecture.ts (REQ-021, ADR-0002).
# Protected path: change only with an accepted ADR that lists it in touches_protected.
#
# A *unit* is a folder. A file belongs to the first unit (in this order) whose path contains it.
# A unit may import only the units in may_import ("core.*" = every unit whose name starts "core.").
# Other units are reached only through their index.ts (or the @praxium/core/<path> alias).
#
# Add a unit here in the same change that creates its folder. The layers a new unit should sit in are
# described in ARCHITECTURE.md: kernel -> model -> (pipeline | work) -> contract -> server -> web.
units:
  core.kernel:              {path: packages/core/src/kernel, may_import: []}
  harness:                  {path: harness/src, may_import: [], public_index: false}
  # The web UI (ADR-0035): layers that depend only upward, api <- data <- screens and ui <- screens. Base UI is reached from web.ui alone (third_party below).
  # Order matters: a file belongs to the first unit whose folder holds it, so web.app (the rest of apps/web/src) comes last.
  web.testsupport:          {path: apps/web/src/test-support, may_import: [], public_index: false}
  web.api:                  {path: apps/web/src/api, may_import: []}
  web.data:                 {path: apps/web/src/data, may_import: [web.api, web.testsupport]}
  web.ui:                   {path: apps/web/src/ui, may_import: [web.testsupport]}
  web.screens:              {path: apps/web/src/screens, may_import: [web.data, web.ui]}
  web.build:                {path: apps/web/config, may_import: [], public_index: false}
  web.app:                  {path: apps/web/src, may_import: [web.data, web.ui, web.screens], public_index: false}

# Only these units may import Node built-ins (core must run anywhere, without Node).
node_builtins: [harness]

# Third-party package -> units allowed to import it. Unknown packages are errors (ARCH020):
# adding a dependency is a decision and needs an ADR plus an entry here.
third_party:
  typescript: [harness]
  yaml: [harness]
  react: [web.ui, web.data, web.screens, web.app, web.testsupport]
  react-dom: [web.app, web.testsupport]
  "@base-ui/react": [web.ui]
  vite: [web.build]
  "@tailwindcss/vite": [web.build]

# Packages only test code (*.test.ts, test-support/) may import.
test_only: [vitest, fast-check]

# Code that may read the wall clock or global randomness (REQ-001, ADR-0002).
nondeterminism_allowed: [packages/core/src/kernel/entropy.ts, harness/]

source_roots: [packages, apps, harness/src, tests/spec]
alias_prefix: "@praxium/core/"
alias_target: packages/core/src
ignored_files: []

# The Go backend (ADR-0019). One module under `root`, one package per unit, read by harness/src/checks/go-*.ts.
# A unit is reached only through its package folder; `internal/<unit>` packages mirror the units of ARCHITECTURE.md.
# Names follow the diagram there. They live apart from the TypeScript units above (a different namespace).
# Add a unit in the same change that creates its folder, with an ADR (this file is a protected path).
go:
  root: backend
  module: github.com/ysk6506/praxium/backend
  units:
    core.kernel:    {path: backend/internal/kernel, may_import: []}
    core.model:     {path: backend/internal/model, may_import: [core.kernel]}
    core.contract:  {path: backend/internal/contract, may_import: [core.kernel]}
    core.worldgen:  {path: backend/internal/worldgen, may_import: [core.kernel, core.model]}
    # Who may do what: the role table and the ports for login and judgement (ADR-0024).
    core.access:    {path: backend/internal/access, may_import: [core.kernel]}
    # The KG as a sequence of applied changes and the storage port (ADR-0025); the conformance suite for its adapters is its own unit, apart so that each unit's tests reach the coverage floor.
    core.graph:     {path: backend/internal/graph, may_import: [core.kernel, core.model]}
    adapter.memstore: {path: backend/internal/memstore, may_import: [core.kernel, core.graph]}
    # The PostgreSQL implementation of the storage port (ADR-0032). core.model is for the grade and basis types the rows carry; its tests run the conformance suite against a real server.
    adapter.pgstore: {path: backend/internal/pgstore, may_import: [core.kernel, core.model, core.graph], test_may_import: [adapter.graphcheck]}
    # The conformance suite is production code of its own (it cannot import "testing"), so it never imports the adapter it checks: only the test that runs it does (ADR-0028).
    adapter.graphcheck: {path: backend/internal/graphcheck, may_import: [core.kernel, core.model, core.graph], test_may_import: [adapter.memstore]}
    # The first three closed queries over the storage port (ADR-0026). The core imports no adapter (ADR-0027): its tests run on graph.ScratchStore.
    core.query:     {path: backend/internal/query, may_import: [core.kernel, core.model, core.graph]}
    # The ingestion pipeline of the vertical slice (ADR-0033): source and mapping definitions, the stages from parse to apply, the state between runs. The core imports no adapter: the bytes of a file come in as a capture, and its tests run on graph.ScratchStore.
    core.ingest:    {path: backend/internal/ingest, may_import: [core.kernel, core.model, core.graph]}
    # Adapters sit outside the core and never import each other: only the composition root joins them.
    # The file adapter: reads the bytes of a file into a capture; the operating system is reached through an opener the composition root gives (ADR-0033).
    adapter.filesource: {path: backend/internal/filesource, may_import: [core.kernel, core.ingest]}
    # The file journal of the built-in file store (ADR-0034): an append-only log and snapshots in one data folder, reached through a Disk interface that the composition root implements. It meets the in-memory store only through method signatures, never by import; its tests run the conformance suite on a store with this journal.
    adapter.filejournal: {path: backend/internal/filejournal, may_import: [core.kernel], test_may_import: [core.graph, adapter.graphcheck, adapter.memstore]}
    # The Excel workbook reader (ADR-0040): ZIP and XML from the standard library, with the safety limits; it also holds the small workbook writer that the tests use. It knows the workbook model of core.ingest and nothing else.
    adapter.xlsx:   {path: backend/internal/xlsx, may_import: [core.kernel, core.ingest]}
    # Built-in authentication (ADR-0044): access tokens, users and service accounts, the bootstrap, the audit log and the failure limiter. The stores sit behind a port of built-in types, so the core imports no adapter.
    core.identity:  {path: backend/internal/identity, may_import: [core.kernel, core.access]}
    # The file store of the identity data: one versioned file in the data folder, written atomically through a Disk interface that the composition root implements (mode 0600).
    adapter.identityfile: {path: backend/internal/identityfile, may_import: [core.kernel]}
    # The conformance suite of the identity store port, production code of its own for the same reason as the storage suite; only its tests import the three stores it is run on (ADR-0044).
    adapter.identitycheck: {path: backend/internal/identitycheck, may_import: [core.kernel], test_may_import: [core.identity, adapter.identityfile, adapter.pgstore]}
    adapter.devauth: {path: backend/internal/devauth, may_import: [core.kernel, core.access]}
    adapter.http:   {path: backend/internal/httpapi, may_import: [core.kernel, core.model, core.contract, core.access, core.graph, core.query]}
    adapter.cli:    {path: backend/internal/cli, may_import: [core.kernel]}
    # The built web UI (ADR-0035): the files of apps/web embedded in the program. It imports nothing; the backend builds and tests without the real build (a placeholder page is committed).
    adapter.webui:  {path: backend/internal/webui, may_import: []}
    # Checks of the read path that need a store with history (ADR-0027); a unit of tests only, so the units above the port stay free of adapters.
    # The development loader of the generator's ground truth (ADR-0027): a developer convenience and test path, not the ingestion pipeline.
    adapter.devload: {path: backend/internal/devload, may_import: [core.kernel, core.model, core.graph, core.worldgen], test_may_import: [core.query]}
    # A package of tests only: its production code (the package clause) imports nothing, everything below is for its _test.go files (ADR-0028).
    adapter.readcheck: {path: backend/internal/readcheck, may_import: [], test_may_import: [core.kernel, core.model, core.graph, core.query, core.access, core.contract, core.worldgen, adapter.memstore, adapter.http, adapter.devload]}
    # A package of tests only: the acceptance of the slice, which runs the generator's source views through the pipeline and compares the KG with the development load of the truth (ADR-0033).
    adapter.ingestcheck: {path: backend/internal/ingestcheck, may_import: [], test_may_import: [core.kernel, core.model, core.graph, core.worldgen, core.ingest, adapter.memstore, adapter.devload, adapter.filesource, adapter.xlsx]}
    cmd.praxium:    {path: backend/cmd/praxium, may_import: ["core.*", "adapter.*"]}
  # The one unit that assembles the program: it picks a role, wires the units and may end the process.
  composition_root: cmd.praxium
  # Module path -> units allowed to import it. The backend uses the standard library and the one driver below.
  # Every module here also needs a row in the table of ARCHITECTURE.md (REQ-239) and an ADR.
  third_party:
    github.com/lib/pq: [adapter.pgstore]
  # Standard-library packages that only the listed units may import: the core knows no operating system and no network.
  # An entry that ends in .go is one file: the environment is read through entropy.go and nowhere else in core.kernel (ADR-0028).
  restricted_stdlib:
    os: [cmd.praxium, backend/internal/kernel/entropy.go]
    os/exec: [cmd.praxium]
    os/signal: [cmd.praxium]
    os/user: [cmd.praxium]
    net: [cmd.praxium, adapter.http]
    net/http: [cmd.praxium, adapter.http, adapter.cli]
    net/rpc: [cmd.praxium]
    syscall: [cmd.praxium]
  # The only files that may read the clock, system randomness and the environment (REQ-001).
  nondeterminism_allowed: [backend/internal/kernel/entropy.go]
  dependency_table: ARCHITECTURE.md
  # Non-test code that locked tests lean on: the case table of the storage conformance suite, and the fixture and the latest-only store that other units tests run on. It is fingerprinted into every test that reaches it, so a case removed or weakened there breaks the lock of the test that runs it (ADR-0028).
  locked_support: [backend/internal/graphcheck, backend/internal/identitycheck, backend/internal/graph/fixture.go, backend/internal/graph/scratch.go]
