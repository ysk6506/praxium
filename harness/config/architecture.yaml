# Architecture contract. Enforced by harness/src/checks/architecture.ts (REQ-021, ADR-0002).
# Protected path: change only with an accepted ADR that lists it in touches_protected.
#
# A *unit* is a folder. A file belongs to the first unit (in this order) whose path contains it.
# A unit may import only the units in may_import ("core.*" = every unit whose name starts "core.").
# Other units are reached only through their index.ts (or the @praxium/core/<path> alias).
#
# Add a unit here in the same change that creates its folder. The layers a new unit should sit in are
# described in ARCHITECTURE.md: kernel -> model -> (pipeline | work) -> contract -> server -> web.
units:
  core.kernel:              {path: packages/core/src/kernel, may_import: []}
  harness:                  {path: harness/src, may_import: [], public_index: false}

# Only these units may import Node built-ins (core must run anywhere, without Node).
node_builtins: [harness]

# Third-party package -> units allowed to import it. Unknown packages are errors (ARCH020):
# adding a dependency is a decision and needs an ADR plus an entry here.
third_party:
  typescript: [harness]
  yaml: [harness]

# Packages only test code (*.test.ts, test-support/) may import.
test_only: [vitest, fast-check]

# Code that may read the wall clock or global randomness (REQ-001, ADR-0002).
nondeterminism_allowed: [packages/core/src/kernel/entropy.ts, harness/]

source_roots: [packages, apps, harness/src, tests/spec]
alias_prefix: "@praxium/core/"
alias_target: packages/core/src
ignored_files: []

# The Go backend (ADR-0019). One module under `root`, one package per unit, read by harness/src/checks/go-*.ts.
# A unit is reached only through its package folder; `internal/<unit>` packages mirror the units of ARCHITECTURE.md.
# Names follow the diagram there. They live apart from the TypeScript units above (a different namespace).
# Add a unit in the same change that creates its folder, with an ADR (this file is a protected path).
go:
  root: backend
  module: github.com/ysk6506/praxium/backend
  units:
    core.kernel:    {path: backend/internal/kernel, may_import: []}
    core.model:     {path: backend/internal/model, may_import: [core.kernel]}
    core.contract:  {path: backend/internal/contract, may_import: [core.kernel]}
    core.worldgen:  {path: backend/internal/worldgen, may_import: [core.kernel, core.model]}
    cmd.praxium:    {path: backend/cmd/praxium, may_import: ["core.*"]}
  # The one unit that assembles the program: it picks a role, wires the units and may end the process.
  composition_root: cmd.praxium
  # Module path -> units allowed to import it. None yet: the backend uses the standard library only.
  # Every module here also needs a row in the table of ARCHITECTURE.md (REQ-239) and an ADR.
  third_party: {}
  # Standard-library packages that only the listed units may import: the core knows no operating system and no network.
  restricted_stdlib:
    os: [cmd.praxium]
    os/exec: [cmd.praxium]
    os/signal: [cmd.praxium]
    os/user: [cmd.praxium]
    net: [cmd.praxium]
    net/http: [cmd.praxium]
    net/rpc: [cmd.praxium]
    syscall: [cmd.praxium]
  # The only files that may read the clock, system randomness and the environment (REQ-001).
  nondeterminism_allowed: [backend/internal/kernel/entropy.go]
  dependency_table: ARCHITECTURE.md
