# Test integrity contract. Enforced by harness/src/checks/testguard.ts and coverage.ts
# (REQ-023, ADR-0002). Protected path: change only with an accepted ADR.
test_globs: ["packages/**/*.test.ts", "apps/**/*.test.ts", "apps/**/*.test.tsx", "harness/src/**/*.test.ts", "tests/spec/**/*.test.ts"]
support_globs: ["packages/**/test-support/**", "apps/**/test-support/**", "harness/src/test-support/**"]
data_globs: ["**/__fixtures__/**", "tests/**/fixtures/**", "backend/**/testdata/**"]
# Go tests (ADR-0023) are found from the `go:` section of architecture.yaml: every Test, Fuzz and Example function of the
# `_test.go` files, locked by package folder and name. Their golden files sit in `testdata/`, locked as data above.
lock: harness/config/test-lock.json

# Configuration that decides which tests run must stay exactly like this.
vitest_config: vitest.config.ts
test_script: vitest run --coverage
vitest_include: ["packages/**/src/**/*.test.ts", "apps/**/src/**/*.test.{ts,tsx}", "harness/src/**/*.test.ts", "tests/spec/**/*.test.ts"]
coverage_include: ["packages/*/src/**", "apps/server/src/**", "apps/web/src/logic/**", "apps/web/src/api/**", "apps/web/src/data/**", "apps/web/src/ui/**", "harness/src/**"]
coverage_exclude_allowed: ["**/*.test.ts", "**/*.test.tsx", "**/test-support/**"]
forbidden_test_options: [exclude, passWithNoTests, allowOnly, retry, bail, testNamePattern, setupFiles, globalSetup, onConsoleLog, dangerouslyIgnoreUnhandledErrors]
# setupFiles is forbidden except for exactly this list: a file that only gives the worker an event-loop turn
# between tests so long spec files can report progress (ADR-0002).
allowed_setup_files: [tests/setup/yield-between-tests.ts]

# Coverage ratchet.
coverage_summary: coverage/coverage-summary.json
coverage_floor: harness/config/coverage-floor.json
min_floor: 90
max_ignore_comments: 3   # `/* v8 ignore */` budget in production code; each needs a reason

# Test files the lock (test-lock.json) and the requirement trace do not cover (ADR-0035). The temporary screens of the web UI
# change with every look at the product and are checked by looking at them; the static test rules and the rest still apply.
unlocked_globs: ["apps/web/src/screens/**"]
