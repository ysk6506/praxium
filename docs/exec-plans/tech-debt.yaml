  - id: TD-0016
    title: "문서 다시 확인이 읽었다는 증거를 남기지 못한다. `reverify`는 같은 메모와 한 번에 열 개가 넘는 대상은 막지만(ADR-0028), 문서와 대상이 모두 그대로인 채 도장만 다시 찍는 것은 된다(기존 테스트의 바탕 자료가 그렇다). `ARCHITECTURE.md`의 단위 표와 `architecture.yaml`의 `may_import`를 기계가 견주지 않아 표가 어긋난 채 세 번 확인 기록이 찍혔고, 독립 감사(`docs.ts audit`)는 `ARCHITECTURE.md`에 한 번뿐이다"
    severity: medium
    cost: "대상과 문서의 해시가 모두 같으면 기록을 거부하고(문서 테스트의 바탕 자료를 고치는 `amends_tests`가 든다), `ARCHITECTURE.md`의 단위 표를 `architecture.yaml`과 견주는 검사(`DOC*`)를 더하고, 감사 대기열(`docs.ts audit-queue`)의 앞 셋을 독립된 눈으로 읽는 일을 정리 작업에 넣는다"
