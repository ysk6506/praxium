  - id: TD-0009
    title: "표준 모델의 타입 20개에 식별 키가 없다. 키가 생길 때까지 어떤 원천도 이 타입의 객체를 채울 수 없고, 수집 단계가 이 타입의 객체를 만들기 전에 풀어야 한다(ADR-0020)"
    severity: medium
    cost: "후속 변경에서 (1) 키가 문맥 구성요소를 둘 이상 가질 수 있게 하고, (2) 이름 붙은 링크로 닿는 순서 없는 객체 집합을 새 구성요소 종류로 두며(끝점 쌍과 멤버 집합, 멤버 ID를 정렬해 정규화), (3) 문맥 링크가 1:1이면 문맥만 있는 키를 허용하고, (4) 키가 요구하는 부모 바인딩은 표준 모델에 보통 바인딩으로 더하며, (5) UnknownObject에 힌트 해시 방식을 선언한다. 테스트의 키 없는 타입 목록은 의도해서만 줄인다"
    created: "2026-11-13"
    due: "2027-02-01"
    status: done
    resolution: "ADR-0022가 다섯을 모두 했다: 문맥 구성요소를 여럿 두고, 집합 구성요소(링크 타입, 나가는 쪽이나 들어오는 쪽, 정확한 크기 선택)를 더하고, 문맥만 있는 키는 1:1 링크일 때 허용하고, 부모 바인딩을 보통 바인딩으로 더하고, UnknownObject에 힌트 해시 방식(is.hint_hash)을 선언했다. 표준 타입 168개가 모두 자기 키를 가지고 키 없는 목록은 비었다(테스트가 잠근다)."
  - id: TD-0010
    title: "API의 인증은 개발용 인증기(고정 토큰 하나)뿐이다. 사내 로그인(OIDC)과 서비스 계정 토큰이 없어서 `api serve -mode production`은 늘 시작을 거부하고(닫힌 쪽이 기본), 개발 모드의 서버도 토큰이 없으면 상태 확인과 오류 설명 말고는 모두 401이다(ADR-0024)"
    severity: medium
    cost: "`access.Authenticator` 포트를 OIDC 어댑터와 서비스 계정 토큰 발급·검증으로 구현하고, `api serve`의 운영 모드 거부(`requireRealAuthenticator`)를 풀어 그것을 고르게 한 뒤 개발용 인증기를 지운다. 길과 계약은 바뀌지 않는다"
    created: "2026-11-13"
    due: "2027-02-01"
    status: open
  - id: TD-0011
    title: "API의 저장소는 메모리 구현(`adapter.memstore`)뿐이다. 운영용 저장소(PostgreSQL 어댑터)가 없어서 `api serve -mode production`은 늘 시작을 거부하고, 개발 모드의 서버는 시작할 때마다 `-dev-truth`로 세계를 다시 적재한다. 서버가 끝나면 KG도 없어진다(ADR-0027)"
    severity: medium
    cost: "저장소 포트(`Catalog`, `Writer`, `Reader`, `Feed`)를 PostgreSQL 어댑터로 구현해 적합성 테스트(`adapter.graphcheck`)을 통과시키고, 시작점이 운영 모드에서 그것을 고르게 하고(`requireRealAuthenticator`의 거부가 TD-0010과 함께 풀린다), 개발 모드의 메모리 저장소와 `-dev-truth`는 테스트와 개발의 길로 남긴다. 길과 계약은 바뀌지 않는다"
    created: "2026-11-13"
    due: "2027-02-01"
    status: open
