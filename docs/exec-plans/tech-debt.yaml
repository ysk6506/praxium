    resolution: "ADR-0019가 Go 코드를 읽는 검사를 만들었다: 단위와 의존 방향과 공개 면, 시계·난수·환경, 모듈 표, 크기와 복잡도, 끄기, 시험의 있음과 커버리지, gofmt와 vet(GOARCH*, GODEP*, GODEBT*, GOIGN*, GOTEST*, GOCOV*, GOTOOL*). 시험 잠금과 품질 등급표와 요구사항 추적은 아직 Go를 읽지 않아 TD-0008로 남겼다."
