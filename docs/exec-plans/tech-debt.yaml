    resolution: "화면은 다른 저장소의 일이 되었다(ADR-0016). 이 저장소의 알파는 모든 기능이 API와 명령줄 클라이언트로 되는 것이고, UX 측정은 화면 저장소가 정한다."
  - id: TD-0003
    title: "하네스 코드에 테라리움 제품에 묶인 조각이 남아 있다: 문서의 숫자 검사가 아는 이름(entity_kinds, tools 등), 서버 환경 변수와 API 길을 찾는 자리(apps/server, contract/routes). 지금은 쓰이지 않아 통과한다"
    severity: low
    cost: "프락시움의 서버와 계약이 생길 때 그 자리에 맞추거나 설정으로 뺀다"
    created: "2026-11-12"
    due: "2027-02-01"
    status: open
    units: [harness]
  - id: TD-0004
    title: "kernel의 해시가 JavaScript의 문자열 표현에 기댄다. 저장되거나 다른 언어와 나누는 값에는 UTF-8 SHA-256과 정규 인코딩을 써야 한다(ADR-0006)"
    severity: medium
    cost: "백엔드의 바탕 부품(Go)에서 정규 바이너리 인코딩 위의 SHA-256을 쓰고, 저장되거나 밖으로 나가는 값이 kernel의 해시를 쓰지 않게 한다"
    created: "2026-11-13"
    due: "2027-02-01"
