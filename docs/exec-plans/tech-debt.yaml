  - id: TD-0007
    title: "임시 콘솔(클로즈 베타까지 기능을 눌러 보는 지울 수 있는 화면)이 이 저장소의 따로 된 폴더에 있다. 프런트엔드 저장소가 서거나 클로즈 베타가 끝나면 지워야 한다(ADR-0016)"
