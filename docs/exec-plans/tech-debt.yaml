  - id: TD-0005
    title: "하네스에 Go 코드를 읽는 검사가 없다(의존 방향, 공개 면, 복잡도와 크기, 시험 잠금과 커버리지, 라이선스, 검사 끄기 주석). 첫 Go 제품 코드가 들어가는 변경에서 함께 만들어야 한다(ADR-0006)"
    severity: medium
    cost: "하네스는 TypeScript 도구로 두고 Go 코드를 읽는 조각을 더한다. 그 전에는 Go 제품 코드를 합치지 않는다"
    created: "2026-11-13"
